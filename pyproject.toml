  [build-system]
  requires = ["setuptools", "wheel"]
  build-backend = "setuptools.build_meta"

  [project]
  name = "hex-qec"
  version = "0.1.0"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "stim>=1.13",
    "stimbposd>=0.1.0",
    "ldpc>=2,<3",
    "pymatching>2.0",
]

[project.optional-dependencies]
experiment = [
    "pandas>=2.0",
    "experiment @ git+https://github.com/ewanmurphy/Experiments.git",
    "plotting_lib @ git+https://github.com/ewanmurphy/plotting_lib.git",
]
